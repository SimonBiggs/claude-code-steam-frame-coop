<!doctype html>
<html><head><meta charset="utf-8"><title>Frame live view</title>
<style>html,body{margin:0;height:100%;background:#000}img{width:100%;height:100%;object-fit:contain}
#s{position:fixed;top:6px;left:8px;color:#888;font:12px sans-serif}</style></head>
<body><img id="v" alt=""><div id="s"></div>
<script>
// The headset's MJPEG stream can freeze (e.g. when a game changes), so reconnect every 20 s,
// and straight away if the stream errors. Host comes from ?host= (default frame).
const host = new URLSearchParams(location.search).get("host") || "frame";
const img = document.getElementById("v"), s = document.getElementById("s");
function connect() { img.src = `http://${host}:8090/?t=${Date.now()}`; s.textContent = new Date().toLocaleTimeString(); }
img.onerror = () => setTimeout(connect, 2000);
connect(); setInterval(connect, 20000);
</script></body></html>
